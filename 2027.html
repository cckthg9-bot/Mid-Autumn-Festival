  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.initFirebase = async function() {
      try {
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mid-autumn-2027';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        if (firebaseConfig) {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          window.remoteDb = db;
          window.appId = appId;
          console.log("Firebase storage initialised successfully.");
        }
      } catch (e) {
        console.warn("Cloud storage fallback to LocalStorage:", e);
      }
    };
  </script>

    /* Sound Effects Engine using Web Audio API */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'pound') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

      else if (score >= 900) title = "中秋神話大宗師 🌕";
      else if (score >= 700) title = "月宮首席智多星 🐰";
      else if (score >= 500) title = "搗藥神手小玉兔 🥮";

      document.getElementById('playerTitle').innerText = title;

      await saveScoreToLeaderboard(userProfile.name, score, title);
    }

    async function saveScoreToLeaderboard(name, score, title) {
      const entry = {
        name: name,
        score: score,
        title: title || '月宮探險家 🏮',
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };

      // 1. LocalStorage Persistence
      let localData = JSON.parse(localStorage.getItem('midautumn_leaderboard') || '[]');
      
      const existingIdx = localData.findIndex(item => item.name === name);
      if (existingIdx >= 0) {
        if (score > localData[existingIdx].score) {
          localData[existingIdx] = entry;
        }
      } else {
        localData.push(entry);
      }

      localData.sort((a, b) => b.score - a.score);
      localData = localData.slice(0, 10);

      localStorage.setItem('midautumn_leaderboard', JSON.stringify(localData));

      // 2. Cloud Firestore Persistence
      if (window.remoteDb && window.appId) {
        try {
          const { collection, addDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
          const colRef = collection(window.remoteDb, 'artifacts', window.appId, 'public', 'data', 'leaderboard');
          await addDoc(colRef, entry);
        } catch (e) {
          console.warn("Cloud save omitted:", e);
        }
      }
    }

    async function openLeaderboard() {
      const modal = document.getElementById('modalLeaderboard');
      const list = document.getElementById('leaderboardList');
      modal.classList.remove('hidden');

      list.innerHTML = `<div class="text-center py-6 text-gray-400">載入榜單資料中...</div>`;

      let data = JSON.parse(localStorage.getItem('midautumn_leaderboard') || '[]');

      if (window.remoteDb && window.appId) {
        try {
          const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
          const colRef = collection(window.remoteDb, 'artifacts', window.appId, 'public', 'data', 'leaderboard');
          const snap = await getDocs(colRef);
          
          let cloudData = [];
          snap.forEach(doc => cloudData.push(doc.data()));

          if (cloudData.length > 0) {
            const mergedMap = new Map();
            [...data, ...cloudData].forEach(item => {
              if (!mergedMap.has(item.name) || item.score > mergedMap.get(item.name).score) {
                mergedMap.set(item.name, item);
              }
            });
            data = Array.from(mergedMap.values());
            data.sort((a, b) => b.score - a.score);
            data = data.slice(0, 10);
          }
        } catch (e) {
          console.warn("Cloud fetch fallback to local:", e);
        }
      }

      if (data.length === 0) {
        list.innerHTML = `<div class="text-center py-8 text-gray-400">目前尚無紀錄，快成為第一位闖關者吧！</div>`;
        return;
      }

      list.innerHTML = data.map((item, index) => {
        let badge = `<span class="font-bold text-gray-400 w-6">${index + 1}</span>`;
        if (index === 0) badge = `<span class="text-xl">🥇</span>`;
        else if (index === 1) badge = `<span class="text-xl">🥈</span>`;
        else if (index === 2) badge = `<span class="text-xl">🥉</span>`;

        return `
          <div class="flex items-center justify-between p-3 my-1 rounded-xl bg-slate-800/60 border border-amber-400/20">
            <div class="flex items-center gap-3">
              ${badge}
              <div>
                <div class="font-bold text-amber-200 text-sm md:text-base">${item.name}</div>
                <div class="text-xs text-gray-400">${item.date || ''}</div>
              </div>
            </div>
            <div class="text-amber-400 font-extrabold text-lg md:text-xl">${item.score} <span class="text-xs text-gray-400">分</span></div>
          </div>
        `;
      }).join('');
    }

    function closeLeaderboard() {
      document.getElementById('modalLeaderboard').classList.add('hidden');
    }

    function showCustomAlert(msg) {
      const div = document.createElement('div');
      div.className = 'fixed top-10 left-1/2 -translate-x-1/2 z-50 bg-amber-500 text-purple-950 font-extrabold px-6 py-3 rounded-2xl shadow-2xl border-2 border-amber-200 animate-bounce text-sm';
      div.innerText = msg;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 2500);
    }

    /* CANVAS BACKGROUND ANIMATION */
    function initCanvas() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.8 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      }));

      const lanterns = Array.from({ length: 6 }, () => ({
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 100,
        speed: Math.random() * 0.5 + 0.3,
        size: Math.random() * 12 + 16
      }));

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
          ctx.fillStyle = `rgba(253, 224, 71, ${Math.abs(s.alpha)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        lanterns.forEach(l => {
          l.y -= l.speed;
          if (l.y < -50) {
            l.y = canvas.height + 50;
            l.x = Math.random() * canvas.width;
          }
          ctx.font = `${l.size}px serif`;
          ctx.fillText('🏮', l.x, l.y);
        });

        requestAnimationFrame(animate);
      }
      animate();
    }

    window.onload = function() {
      initCanvas();
      if (window.initFirebase) window.initFirebase();
    };
  </script>
